<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light"><title>생태계 자료 검색</title><link rel="stylesheet" href="./style.css"><script type="module" src="./app.js"></script></head>
<body>
<a class="skip" href="#feed">자료로 바로 이동</a>
<header><form id="search-form" role="search"><label class="sr-only" for="query">자료 검색</label><svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></svg><input id="query" type="search" placeholder="궁금한 내용을 검색해 보세요" enterkeyhint="search" autocomplete="off"><button type="button" id="clear" aria-label="검색어 지우기" hidden>×</button><button type="submit">검색</button></form></header>
<main><div id="notice" role="status" hidden></div><div class="feed-meta"><span id="status" role="status" aria-live="polite">자료를 불러오는 중</span><span aria-hidden="true">EXPLORE</span></div><section id="feed" aria-label="자료 목록" tabindex="-1"></section><div id="empty" hidden><h2>일치하는 자료가 없어요</h2><p>다른 낱말이나 짧은 검색어로 찾아보세요.</p></div><div id="error" role="alert" hidden><p>자료를 불러오지 못했습니다.</p><button id="retry">다시 시도</button></div><div id="sentinel"></div><button id="more" hidden>자료 더 보기</button><p id="end" hidden>여기까지 모든 자료를 살펴봤어요.</p></main>
<dialog id="detail" aria-labelledby="detail-title"><div class="detail-bar"><button id="back" autofocus>← 뒤로</button></div><article id="detail-body"></article></dialog>
</body></html>
